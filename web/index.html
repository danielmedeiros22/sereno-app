<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="956821237585-q5ghq0odr09rdj7osli057l7eadvoa0s.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-title" content="sereno_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sereno_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Paint the document as well as Flutter's canvas, including the area
       sampled by the installed app's status bar and overscroll effects. */
    :root { --sereno-background: #F8FAFC; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --sereno-background: #020617; color-scheme: dark; }
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: var(--sereno-background);
    }
    /* Flutter paints text and selection on its canvas. Keep the native editing
       layer invisible, including selected glyphs, to avoid a second rendering. */
    flutter-view input.flt-text-editing::selection,
    flutter-view textarea.flt-text-editing::selection {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      background-color: transparent !important;
      text-shadow: none !important;
    }
    flutter-view input.flt-text-editing::-moz-selection,
    flutter-view textarea.flt-text-editing::-moz-selection {
      color: transparent !important;
      background-color: transparent !important;
      text-shadow: none !important;
    }
  </style>
  <script>
    // Called again by Flutter when the saved/system theme changes. Do not use
    // black-translucent: content must remain below the iPhone status bar.
    window.serenoSetTheme = function (dark) {
      const color = dark ? '#020617' : '#F8FAFC';
      const root = document.documentElement;
      root.style.setProperty('--sereno-background', color);
      root.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = color;
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
        dark ? 'black' : 'default';
    };
    window.serenoSetTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="report_file_save.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
